name: sensor_shadows
description: Accelerometer-driven shadows and lighting for tactile Flutter cards, buttons, and custom surfaces, with smoothing and reduced-motion support.
version: 0.1.0
repository: https://github.com/pinzarulab/sensor_shadows

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  checks: ^0.3.2

topics:
  - sensors
  - animation
  - shadows
  - widgets
  - ui
